name: Refresh data
on:
  schedule: [{ cron: '0 9 * * 2' }] # Tuesdays, after the weekend's games
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { CFBD_API_KEY: '${{ secrets.CFBD_API_KEY }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run data
      - name: Add recruiting ratings when a key is configured
        if: env.CFBD_API_KEY != ''
        run: npm run data:recruits
      - run: |
          git config user.name "outlier-bot"
          git config user.email "outlier-bot@users.noreply.github.com"
          git add public/data && git diff --cached --quiet || git commit -m "Refresh data" && git push
